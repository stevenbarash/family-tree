name: Release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # The CLI bundle inlines core's TypeScript source, so core's
      # dependencies must be installed for esbuild to resolve them.
      - name: Install core deps
        run: npm install --no-audit --no-fund
        working-directory: core

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: cli

      - name: Build
        run: npm run build
        working-directory: cli

      - name: Verify build
        run: node dist/wai.cjs --version
        working-directory: cli

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          mkdir -p "wai-v${VERSION}/bin"
          cp cli/dist/wai.cjs "wai-v${VERSION}/bin/wai"
          tar -czf "wai-v${VERSION}.tar.gz" "wai-v${VERSION}"
          shasum -a 256 "wai-v${VERSION}.tar.gz" > "wai-v${VERSION}.tar.gz.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wai-v*.tar.gz
            wai-v*.tar.gz.sha256
          body_path: cli/RELEASE_NOTES.md
          make_latest: "false"
