name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Typecheck + test every package. Before this, CI only built the CLI —
  # core's 600+ tests, the drift tests, and every frontend/evals test
  # never ran on a PR, so a regression could merge to main green.
  #
  # `npm install` (not `npm ci`): the per-package lockfiles drift under
  # Dependabot churn, and `npm ci`'s strict lock check turns that drift
  # into a hard CI failure unrelated to the change under test. The job's
  # purpose is to catch typecheck/test regressions, which `npm install`
  # serves; lockfile hygiene is tracked separately.
  verify:
    name: verify (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, cli, frontend, evals]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            ${{ matrix.package }}/package-lock.json

      # cli/frontend typecheck (and the bundled build) resolve `@core/*`
      # to core's TypeScript source, so core's own dependencies must be
      # installed even when core is not the package under test.
      - name: Install core deps
        if: matrix.package != 'core'
        run: npm install --no-audit --no-fund
        working-directory: core

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: ${{ matrix.package }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.package }}

      - name: Test
        run: npm test
        working-directory: ${{ matrix.package }}

      # The CLI ships as a single bundled binary; verify the bundle
      # builds and runs — esbuild bundling can break even when tsc and
      # tests pass. Runs only on the cli leg, folded into verify so it
      # reuses the leg's already-installed core + cli deps instead of a
      # separate job that reinstalls both.
      - name: Build
        if: matrix.package == 'cli'
        run: npm run build
        working-directory: cli

      - name: Verify build
        if: matrix.package == 'cli'
        run: node dist/wai.cjs --version
        working-directory: cli
